    pago_parcial_toggle: true                       # [ins-2611 CORREGIDO 20260611] SÍ existe toggle "Pago parcial" en el detalle del documento: ion-toggle en el mismo ion-row que el ion-label "Pago parcial:" (al final del detalle). Activar (false→true) → el ion-input inmediatamente debajo (muestra el saldo, ej "1,50") pasa a editable → escribir el monto parcial → Aceptar. NO es la columna "Pago Parcial" de la tabla (íconos search-sharp/receipt-outline = historial solo lectura). DM-COB-046 debe usar ESTE toggle.

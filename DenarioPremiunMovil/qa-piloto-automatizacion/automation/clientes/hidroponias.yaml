  #    datos de hidroponias cambian solos y un oráculo escrito a mano nace
  #    vencido — produce FAILs que no son defectos, o PASSes que no probaron nada.
  sugerido:
    aplica: true
    # Días hasta la próxima visita. Con 1, la guarda `stock actual >= sugerido`
    # deja TODOS los sugeridos en 0 y parece que el cálculo no funciona: NO es
    # un hallazgo, es la guarda. Con 10 salen mayores que 0 y son medibles.
    dias_hasta_proxima: 10


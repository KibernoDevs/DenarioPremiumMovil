# ═══════════════════════════════════════════════════════════════════════════
# VARIABLES GLOBALES
#
# 🔴 Los dos dumps CHOCAN en 22 claves. Se aplicó la regla conocida:
#    **gana el GLOBAL**, aunque el override de cliente parezca más nuevo
#    (el del cliente es de 2023; el global, de 2025).
#    Las marcadas [⚔] son las que difieren — la UI en vivo desempata, así que
#    conviene confirmarlas en la primera corrida antes de dar por buena una N/A.
# ═══════════════════════════════════════════════════════════════════════════
vgs:
  # ── Generales ───────────────────────────────────────────────────────────
  enterpriseEnabled: true
  multiCurrency: true
  multiCurrencyCollection: true
  multiCurrencyOrder: true
  multiCurrencyDeposit: true
  userMustActivateGPS: false          # ⇒ sin la guarda de GPS que cuelga la navegación
  userCanUploadFiles: true
  longitudComentario: 200             # [⚔] global 200 · cliente 185
  quPageProduct: 50                   # [⚔] global 50 · cliente 100
  tagRif: "RIF"
  tagIVA: "IVA"

  # ── Cobros ──────────────────────────────────────────────────────────────
  # ✅ LEÍDAS DEL DISPOSITIVO el 2026-09-02 con
  #    `node automation/playwright/leer-vg-dispositivo.js cobros`
  #    Eso resuelve los conflictos entre los 2 dumps: mandan estos valores.
  #    🔴 La BD **no** sirve para esto: `global_configuration` es un catálogo
  #       (valor='true' = "la variable existe"), no los valores efectivos.
  # ⚠ RELEÍDAS DEL EQUIPO el 2026-09-04, tras mudar 4K a CARIBE. Dos cambiaron:
  requiredCollectionAttachments: false # ⇐ ERA true hasta el 03/09. Ahora **NO** exige
                                       #    adjunto: los cobros y anticipos SE PUEDEN ENVIAR.
                                       #    Confirmado a mano por QA y en el equipo.
  requiredComment: true                # longitudComentario está arriba, en Generales
  colletionPayment: "true-true-true-true-true-true"   # ⇐ ERA "true-false-…": se habilitó
                                       #    un método más. Leer en la UI cuáles ofrece.
                                       #    🔴 Igual LEER EN LA UI qué métodos ofrece: deducirlos
                                       #       del orden del catálogo ya falló antes.
  enablePartialPayment: true
  alwaysPartialPayment: false
  historicPartialPayment: false

  # Retención
  retencion: true                     # el campo de retención dentro del cobro
  cobroRetencion: false               # ⇒ el SUBMÓDULO «Retención» del menú NO aplica
  userCanAddRetention: true
  alwaysRetention: false
  missingRetention: false
  dynamicRetentions: false
  sizeRetention: 5                    # 🔑 dígitos EXACTOS del nro. de comprobante
  formatRetention: 0
  retentionDocTypeCR: true
  requiredRetentionAttachments: false

  # IGTF
  userCanSelectIGTF: false            # ⇒ el IGTF NO se muestra en el cobro en 4K
  igtfDefault: false
  disableCheckIGTF: false
  userCanCollectIva: false

  # Tolerancias y anticipo  ── los números que hay que probar ──
  # ✅ RELEÍDAS DEL DISPOSITIVO el 10/09, al cierre de `fixes_cobros_20260910`.
  #    Manda el equipo (`node automation/playwright/leer-vg-dispositivo.js cobros`).
  tolerancia0: true                   # permite enviar cobros que no cierran en 0
  TipoTolerancia: 0                   # 0 = Importe · 1 = Porcentaje
  RangoToleranciaPositiva: 49.99      # USD  ⚠ NO es 10: el 10/09 el equipo devolvió 49.99
  RangoToleranciaNegativa: 10         # USD
  MonedaTolerancia: "USD"
  cobroPrepago: true                  # submódulo «Anticipo» disponible en el menú
  automatedPrepaid: true              # anticipo automático por excedente
  prepaidRangeAmount: 0.01              # excedente mínimo del anticipo
  prepaidRangeCurrency: "USD"
  prepaidCurrency: "USD"
  prepaidPaymentMethod: "pa"
  # 🔴 RE-CORREGIDO 14/09. Lo de abajo es la lectura del 10/09, cuando
  #    `prepaidRangeAmount` valía 50 en el equipo. **Hoy vale 0,01** (la web lo
  #    bajó el 11/09 14:07:57) y el fix del umbral SÍ entró en la build: el techo
  #    de tolerancia se descuenta ANTES, en
  #    `resolvePrepaidEligibleExcessInCollectionCurrency` (`normalizedRaw −
  #    positiveLimit`), aunque `getAutomatedPrepaidActivationThreshold()` siga
  #    devolviendo `prepaidRangeAmount` a secas.
  #        UMBRAL EFECTIVO = RangoToleranciaPositiva + prepaidRangeAmount = 50,00
  #        ANTICIPO CREADO = exceso − RangoToleranciaPositiva
  #    Comprobado en la nube: cobro 2706 (1.862,00) + anticipo 2707 (0,01).
  #    ⇒ El oráculo barato NO es el cuerpo de getAutomatedPrepaidActivationThreshold,
  #      sino la EXISTENCIA de `resolvePrepaidEligibleExcessInCollectionCurrency`.
  #    Cubierto por los casos nuevos DM-COB-056 / DM-COB-057 del script.
  #
  #    ── lectura del 10/09, conservada como contexto ──
  #        getAutomatedPrepaidActivationThreshold() = prepaidRangeAmount  ⇒ 50 USD
  #    y la función que sumaría el techo de tolerancia
  #    (`getPositiveToleranceCeilingInCollectionCurrency`) NO EXISTE en el bundle.
  #    Los tres tramos REALES con 49,99 / 50 (medidos, no deducidos):
  #        ≤ 49,99  → dentro de tolerancia, Enviar directo  (borde INCLUSIVO)
  #        —        → NO hay ningún importe que bloquee por exceso: la banda es
  #                   el intervalo abierto (49,99 ; 50,00), de ancho CERO
  #        ≥ 50,00  → genera ANTICIPO AUTOMÁTICO
  #        ≤ −10,00 dentro de tolerancia · −10,01 BLOQUEA
  #    ⚠ La banda que bloquea vale `prepaidRangeAmount − RangoToleranciaPositiva`.
  #      Si alguien baja RangoToleranciaPositiva a 10, se ABRE una banda de 39,99
  #      (10,01 … 49,99) en la que el cobro no se puede enviar.
  #    ⚠ Y si prepaidRangeAmount queda POR DEBAJO de la tolerancia, el anticipo se
  #      come la tolerancia: toda diferencia ≥ prepaidRangeAmount genera anticipo
  #      aunque esté dentro de tolerancia (comprobado con 1 / 10,50 → anticipo de 1 USD).
  #    Detalle: automation/reports/4k/fixes_cobros_20260910/01-tolerancia-y-anticipo.md
  # 🔑 `prepaidRangeAmount` NO admite decimales ni 0 en la web: el spinner de esa fila
  #    es ENTERO (precision 0, step 1, min 1) y rechaza «0,01» y «0» EN SILENCIO,
  #    dejando 1. Las dos tolerancias sí admiten decimales (precision 2, step 0,01, min 0).
  # 🔴 Una VG cambiada en la web NO llega al equipo con «Sincronizar» del HOME:
  #    solo baja con un LOGIN nuevo (~80 s). Releer siempre del equipo antes de medir.

  # Descuento de cobro
  userCanSelectCollectDiscount: true  # ⇒ botón «Asignar descuento» en el DETALLE del documento
  maxCollectDiscount: 0              # tope % sobre la SUMA de los descuentos seleccionados
  # 🔴 14/09: el EQUIPO trae **0**, no 85. Ojo con `Number(x) || 100` en run.js:
  #    convierte el 0 en «sin tope», que NO es lo mismo. Qué hace la app con 0 hay
  #    que leerlo en la UI (el aviso del tope dice el número), no deducirlo.
  # ⚠ El catálogo (`collect_discounts`) de 4K trae UNA sola fila: "Probando" 80 %
  #   con require_input=false. Con eso el tope de 85 era inalcanzable por UI
  #   (80 fijo, y 80 ≤ 85). Se resuelve por WEB, sin tocar BD — dos opciones:
  #     · bajar maxCollectDiscount (Variables Globales → Cobros) a 80 y luego a 79
  #     · crear más descuentos en **Empresa → Configuración → Descuentos para Cobros**
  #   En ambos casos hay que SINCRONIZAR el equipo después.

  # Otros
  # ⚠ enableDifferenceCodes NO apaga «Dif. Devolución/Faltante». Ese campo vive
  #   en el detalle del documento (cobro-documents.component.html:735) y aparece
  #   SIEMPRE. Esta variable apaga otra cosa: el selector de «origen de
  #   diferencia» del método de pago OTROS (cobro-pagos.component.html:689).
  # 🔴 Estaba en `false` y el equipo traía `true`. Corregido el 14/09/2026 tras
  #   medirlo dos veces en `localStorage.globalConfiguration`. QA lo encendió para
  #   poder probar las notas de crédito con saldo a favor (método OTROS + código
  #   de diferencia). Si vuelve a aparecer en false, mirar el equipo, no el perfil.
  enableDifferenceCodes: true         # ⇒ habilita el selector de origen del método OTROS
  clientBankAccount: true
  currencyBank: false
  historicoTasa: true
  validateCollectionDate: false
  signatureCollection: false

  # ── Pedidos ─────────────────────────────────────────────────────────────
  orderEnterpriseEnabled: false       # solo en el dump de cliente
  listProductsBy: "lineas"            # solo en el dump de cliente
  selectOrderType: true               # [⚔]
  orderPedidoSeleccion: true          # [⚔]
  userCanChangePriceList: false
  userCanChangePaymentConditions: true # [⚔]
  userCanChangeWarehouse: true        # [⚔]
  userCanSelectProductDiscount: false
  userCanSelectGlobalDiscount: false
  userCanSelectIVA: false
  validateNuOrder: false
  productMinMul: false                # [⚔] global false · cliente true
  conversionByPriceList: false        # [⚔]

  # ── Inventarios / stock ─────────────────────────────────────────────────
  expirationBatch: true               # [⚔] ⇒ Lote y Fecha OBLIGATORIOS al inventariar
  validStock: true                    # [⚔] 🔑 la validación de stock está ACTIVA
  validateWarehouses: true            # [⚔]
  stock0: false                       # 🔴 con validStock=true y stock0=false, un producto
                                      #    agotado NO abre su panel y NO avisa. Antes de
                                      #    reportar "el ítem no responde", mirar su Inventario.
  hideStock0: false                   # [⚔]
  showStock: false                    # [⚔]
  requireClientStock: false           # [⚔]
  suggestedOrder: true
  suggestedOrderByDispatchAndReturn: false   # ⇒ el sugerido por despacho/devolución NO aplica

  # ── Devoluciones ────────────────────────────────────────────────────────
  validateReturn: true                # 🔑 TIPO B: es la FACTURA la que habilita las tabs
  requeridedNroFactura: false         # [⚔] global false · cliente true
  signatureReturn: true
  # retentionDocTypeCR vive en el bloque de Cobros (es una variable de retención)

  # ── Visitas ─────────────────────────────────────────────────────────────
  signatureVisit: false


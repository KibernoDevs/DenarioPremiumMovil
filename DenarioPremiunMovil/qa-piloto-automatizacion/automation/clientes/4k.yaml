# NOTAS PARA LA CORRIDA
# ═══════════════════════════════════════════════════════════════════════════
# 1. 🔴 El cliente de prueba manda. Si el módulo no habilita las pestañas, casi
#    siempre es que el cliente elegido NO CARGA en el equipo, no que la app falle.
#    Verificar en la UI qué clientes lista antes de dar nada por roto.
# 2. `requiredCollectionAttachments` pasó a **false** el 04/09: los cobros y
#    anticipos YA SE PUEDEN ENVIAR sin adjunto. La regla vieja de "dejar en
#    Guardado" quedó sin efecto para este cliente.
# 3. 🔴 `validStock=true` + `stock0=false` ⇒ elegir SIEMPRE productos con stock.
# 4. `userMustActivateGPS=false` ⇒ no aplica la espera larga por la guarda de GPS.
# 5. `expirationBatch=true` ⇒ al inventariar, LOTE y FECHA son obligatorios.
# 6. El REQ de Bancos NO cubre el caso multi-empresa con este cliente.
# 7. Sincronizar con el botón **«Sincronizar» del HOME** (~15 s). No salir de
#    sesión: es lento y una vez dejó la app colgada varios minutos.

<div class="client-new-potential-client">
    <div class="cobroComponent" sticky-below-view>
        <ion-segment value="default" [(ngModel)]="segment">
            <ion-segment-button value="default" (click)="onChangeTab(segment)">
                <ion-label>{{this.clientLogic.clientTags.get('CLI_SEGMENT_GENERAL')}}</ion-label>
            </ion-segment-button>
            <ion-segment-button value="adjuntos" (click)="onChangeTab(segment)">
                <ion-label>{{this.clientLogic.clientTags.get('CLI_SEGMENT_ADJUNTOS')}}</ion-label>
            </ion-segment-button>
        </ion-segment>
    </div>

    <div [ngSwitch]="segment">
        <div *ngSwitchCase="'default'">
            <div>
                <!-- <form [formGroup]="newPotentialClient" (ngSubmit)="validatePotentialClient(newPotentialClient)"> -->
                <form [formGroup]="newPotentialClient">
                    <ion-grid>
                        <ion-row>
                            <ion-col>
                                <!-- <ion-col size="12">
                                    <ion-label
                                        class="titulosnegrita">{{this.clientLogic.clientTags.get('CLI_NEW_POT_EMPRESA')}}</ion-label>
                                </ion-col> -->
                                <ion-list>
                                    <ion-col size="12" *ngIf="!disabledSelectEnterprise">
                                        <div class="listado-enterprise-selector ion-text-center"
                                            [class.potential-send-error-hint]="shouldShowEnterpriseSendError()">
                                            <ion-select class="ion-text-center always-flip"
                                                [disabled]="this.clientLogic.disabledEnterprise == true ? true : false"
                                                placeholder="{{this.clientLogic.clientTags.get('CLI_SELECTOR')}}"
                                                formControlName="idEnterprise"
                                                (ionChange)="changeEnterprise($event.detail.value)"
                                                toggleIcon="caret-down-sharp" interface="popover"
                                                labelPlacement="stacked">
                                                <ion-select-option *ngFor="let enterprise of clientLogic.enterprises"
                                                    [value]="enterprise.idEnterprise">{{enterprise.lbEnterprise}}</ion-select-option>
                                            </ion-select>
                                        </div>
                                    </ion-col>
                                </ion-list>
                            </ion-col>
                        </ion-row>
                        <ion-row *ngIf="disabledSelectEnterprise">
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_EMPRESA')}}:"
                                    label-placement="floating" fill="outline"
                                    [value]="clientLogic.empresaSeleccionada.lbEnterprise"
                                    [readonly]="isDisabled"></ion-input>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_NOMBRE')}}:"
                                    label-placement="floating" fill="outline"
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_NOMBRE')}}:"
                                    formControlName="naClient" [(ngModel)]="clientLogic.potentialClient.naClient"
                                    (ionInput)="onNaClientChange()" #naClientInput [readonly]="isDisabled"
                                    [maxlength]="fieldMax.naClient"
                                    [class.potential-send-error-hint]="shouldShowFieldSendError('naClient')"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.naClient"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.naClient"></app-text-comment-counter>
                                <ion-label *ngIf="newPotentialClient.errors?.['required']">
                                    {{this.clientLogic.clientTags.get('CLI_NEW_POT_MENSAJE_ERROR_NOMBRE_CLIENTE')}}
                                </ion-label>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_RIF')}}:"
                                    label-placement="floating" fill="outline"
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_RIF')}}:"
                                    formControlName="nuRif" [(ngModel)]="clientLogic.potentialClient.nuRif"
                                    (ionInput)="onNuRifChange()" #nuRifInput [readonly]="isDisabled"
                                    [maxlength]="fieldMax.nuRif"
                                    [class.potential-send-error-hint]="shouldShowFieldSendError('nuRif')"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.nuRif"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.nuRif"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_DIRECCION')}}:"
                                    label-placement="floating" fill="outline"
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_DIRECCION')}}:"
                                    formControlName="txAddress" [(ngModel)]="clientLogic.potentialClient.txAddress"
                                    (ionInput)="onTxAddressChange()" #txAddressInput [readonly]="isDisabled"
                                    [maxlength]="fieldMax.txAddress"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.txAddress"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.txAddress"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_DIRECCION_ENTREGA')}}:"
                                    label-placement="floating" fill="outline"
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_DIRECCION_ENTREGA')}}:"
                                    formControlName="txAddressDispatch"
                                    [(ngModel)]="clientLogic.potentialClient.txAddressDispatch" [readonly]="isDisabled"
                                    [maxlength]="fieldMax.txAddressDispatch"
                                    (ionChange)="checkForm()" #txAddressDispatchInput
                                    (ionInput)="onTxAddressDispatchChange()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.txAddressDispatch"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.txAddressDispatch"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_OBSERVACION')}}:"
                                    label-placement="floating" fill="outline"
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_OBSERVACION')}}:"
                                    formControlName="txClient" [(ngModel)]="clientLogic.potentialClient.txClient"
                                    (ionInput)="onTxClientChange()" #txClientInput [readonly]="isDisabled"
                                    [maxlength]="fieldMax.txClient"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.txClient"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.txClient"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_RESPONSABLE')}}:"
                                    label-placement="floating" fill="outline" #naResponsibleInput
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_RESPONSABLE')}}:"
                                    formControlName="naResponsible"
                                    [(ngModel)]="clientLogic.potentialClient.naResponsible"
                                    (ionInput)="onNaResponsibleChange()" [readonly]="isDisabled"
                                    [maxlength]="fieldMax.naResponsible"
                                    [class.potential-send-error-hint]="shouldShowFieldSendError('naResponsible')"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.naResponsible"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.naResponsible"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_EMAIL')}}:"
                                    label-placement="floating" fill="outline" #emClientInput
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_EMAIL')}}:"
                                    formControlName="emClient" [(ngModel)]="clientLogic.potentialClient.emClient"
                                    (ionInput)="onEmClientChange()" [readonly]="isDisabled"
                                    [maxlength]="fieldMax.emClient"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.emClient"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.emClient"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_TELEFONO')}}:"
                                    label-placement="floating" fill="outline" #nuPhoneInput
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_TELEFONO')}}:"
                                    formControlName="nuPhone" [(ngModel)]="clientLogic.potentialClient.nuPhone"
                                    (ionInput)="onNuPhoneChange()" [readonly]="isDisabled"
                                    [maxlength]="fieldMax.nuPhone"
                                    (ionChange)="checkForm()"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.nuPhone"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.nuPhone"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row>
                            <ion-col>
                                <ion-input label="{{this.clientLogic.clientTags.get('CLI_NEW_POT_WEB')}}:"
                                    label-placement="floating" fill="outline" #naWebSiteInput
                                    placeholder="{{this.clientLogic.clientTags.get('CLI_NEW_POT_WEB')}}:"
                                    formControlName="naWebSite" [(ngModel)]="clientLogic.potentialClient.naWebSite"
                                    (ionInput)="onNaWebSiteChange()" [readonly]="isDisabled"
                                    [maxlength]="fieldMax.naWebSite"></ion-input>
                                <app-text-comment-counter [value]="clientLogic.potentialClient.naWebSite"
                                    [minLength]="textCommentMinLength"
                                    [maxLength]="fieldMax.naWebSite"></app-text-comment-counter>
                            </ion-col>
                        </ion-row>
                        <ion-row *ngFor="let field of dynamicFieldService.dynamicFields">
                            <ion-col>
                                <ion-select [label]="field.naLabel" labelPlacement="floating" fill="outline"
                                    [formControlName]="'dyn_' + field.coField"
                                    [disabled]="isDisabled"
                                    interface="popover"
                                    toggleIcon="caret-down-sharp"
                                    [class.potential-send-error-hint]="shouldShowFieldSendError('dyn_' + field.coField)"
                                    (ionChange)="checkForm()">
                                    <ion-select-option *ngFor="let opt of field.options"
                                        [value]="opt.coOption">{{opt.txLabel}}</ion-select-option>
                                </ion-select>
                            </ion-col>
                        </ion-row>
                        <ion-row
                            *ngIf="this.clientLogic.potentialClient.stPotentialClient == 0 || this.clientLogic.potentialClient.stPotentialClient == undefined">
                            <ion-col>
                                <p>
                                    <ion-button class="masInfo" fill="clear" (click)="onCoordenadaChange()"
                                        aria-label="Ver comentario" style="text-transform: capitalize;">
                                        Agregar/Editar ubicación
                                    </ion-button>
                                </p>
                            </ion-col>
                        </ion-row>
                        <ion-row *ngIf="(clientLogic.potentialClient?.coordenadaClient?.length ?? 0) > 0">
                            <ion-col>
                                <ion-input label="Coordenada:" label-placement="floating" fill="outline"
                                    #coordenadaInput placeholder="Coordenada:" formControlName="coordenadaClient"
                                    [(ngModel)]="clientLogic.potentialClient.coordenadaClient" readOnly
                                    tabindex="-1"></ion-input>
                            </ion-col>
                        </ion-row>
                    </ion-grid>
                </form>
            </div>
        </div>

        <div *ngSwitchCase="'adjuntos'">
            <div>
                <app-adjunto #selectorAdjuntos></app-adjunto>
            </div>
        </div>
    </div>

</div>
